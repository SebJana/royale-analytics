services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The image enables --auth only when these are set, and creates the root
      # user from them on an empty data volume. A missing value aborts the
      # start instead of silently running Mongo without access control.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PWD:?set MONGO_ROOT_PWD in .env}
    volumes:
      # Init scripts run only while this volume is empty, so they never
      # recreate users over existing data.
      - mongo_data:/data/db
      - ./db/mongo-init/:/docker-entrypoint-initdb.d:ro
    networks:
      - cr-analytics

  mongo-backup:
    build: ./db/backup
    container_name: mongo-backup
    restart: unless-stopped
    depends_on:
      - mongo
      - redis-cache
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_AUTH_DB: ${MONGO_APP_DB}
    volumes:
      - ./db/backups:/backups
    networks:
      - cr-analytics

  data_scraper:
    build:
      context: ./backend/
      dockerfile: data_scraper/Dockerfile
    container_name: data_scraper
    depends_on:
      - mongo
      - redis-key-store
    env_file:
      - .env
    volumes:
      # Card image sets, written here and served by the frontend's nginx
      - card-images:/data/card-images
    networks:
      - cr-analytics
    # Read-only scraper dashboard (/), snapshot (/status) and history
    # (/history) for administrators. Bound to the host's
    # loopback interface only: reachable from a shell on this machine or an
    # SSH tunnel, never from the network. Do not proxy it through nginx.
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  # Reconstructible database/API/media data. Eviction is acceptable here.
  redis-cache:
    image: redis:8.0-alpine
    container_name: redis-cache
    # upon hitting max memory, delete least recently used elements
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb           
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - cr-analytics

  # All auth challenge state must survive cache invalidation and cache pressure.
  # noeviction preserves active challenges; new writes fail visibly if this
  # deliberately bounded store is ever undersized.
  redis-auth-state:
    image: redis:8.0-alpine
    container_name: redis-auth-state
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy noeviction
    restart: unless-stopped
    networks:
      - cr-analytics

  # Shared key leases and scheduling state. Never evict active coordination data.
  # The battle schedule needs roughly 250 bytes per tracked player.
  redis-key-store:
    image: redis:8.0-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - redis-key-store-data:/data
    restart: unless-stopped
    networks:
      - cr-analytics

  redis-rate-limit:
    image: redis:8.0-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly no
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - cr-analytics

  api:
    build:
      context: ./
      dockerfile: backend/app/Dockerfile
    container_name: api
    depends_on:
      - mongo
      - redis-cache
      - redis-auth-state
      - redis-key-store
      - redis-rate-limit
    env_file:
      - .env
    environment:
      # Motor's thread pool, cpu_count() * 5 by default. A wait for a free
      # thread is outside the request's Mongo deadline, so it exceeds the
      # connection pool and most queueing happens in the driver instead.
      # NOTE Keep above MONGO_MAX_POOL_SIZE in backend/app/src/core/settings.py.
      MOTOR_MAX_WORKERS: "110"
    volumes:
      # Saved player search index, loaded on restart instead of rebuilt.
      # NOTE Matches SNAPSHOT_PATH in player_search/snapshot.py.
      - search-index:/data/search
    networks:
      - cr-analytics
    restart: unless-stopped

  frontend:
    build:
      context: ./
      dockerfile: frontend/Dockerfile
    container_name: frontend
    volumes:
      # Card image sets of the data scraper (see data_scraper/src/card_images.py)
      - card-images:/usr/share/nginx/card-images:ro
    networks:
      - cr-analytics
    ports:
      - "80:80"
      # Optional second public port. Remove this line when only port 80 should be exposed.
      # Swagger also remains public on port 80 until its nginx location is removed.
      - "8000:80"
    depends_on:
      - api

volumes:
  # Not reconstructible, so Compose never creates or deletes it, not even with
  # `down -v`. The fixed name keeps a renamed project from starting on a fresh,
  # empty volume. Create it once per machine (see README).
  mongo_data:
    external: true
    name: clash-royale-analytics_mongo_data
  redis-data:
  redis-key-store-data:
  # Reconstructible: the next card refresh rebuilds a lost set from the CDN.
  card-images:
  # Reconstructible: the API builds the search index from Mongo when it is lost.
  search-index:

networks:
  cr-analytics:
    driver: bridge
