server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Card images mirrored by the data scraper (data_scraper/src/card_images.py).
    # A version directory never changes once published, so browsers keep its
    # files for good. Only the WebP files of published sets match; manifests
    # and the hidden temporary sets stay private.
    # NOTE The version length and the variant key (any iconUrls key besides
    # "medium") match VERSION_LENGTH and ICON_KEY_PATTERN in card_images.py.
    location ~ "^/card-images/[0-9a-f]{16}/[0-9]+(-[A-Za-z][A-Za-z0-9]{0,31})?\.webp$" {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Anything else under /card-images/ would otherwise fall through to the
    # SPA and answer a missing image with index.html.
    location /card-images/ {
        return 404;
    }

    # A calibration is a short-lived WebSocket exchange, so it needs an
    # explicit HTTP/1.1 upgrade rather than the normal HTTP API proxy settings.
    location = /api/auth/halli-galli/calibration {
        proxy_pass http://api:8000/api/auth/halli-galli/calibration;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Keep the browser's port for the same-origin LAN calibration check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Proxy all /api to backend container
    location /api/ {
        proxy_pass http://api:8000/api/;
        # NOTE Above the browser's timeout (12 s, src/services/api/axios.ts),
        # which is above the API's Mongo deadline (MONGO_REQUEST_TIMEOUT_S, 8 s).
        proxy_read_timeout 15s;

        # Use the connecting peer; discard any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
    }

    # Publish FastAPI's documentation without exposing the API container directly.
    # Remove or protect this location if Swagger should not be public.
    location ~ ^/(docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
